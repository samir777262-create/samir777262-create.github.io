<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFS Liveness</title>
<style>
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f5f6f8;color:#16233a;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .card{background:#fff;max-width:420px;margin:20px;padding:28px 24px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08);text-align:center}
  h1{font-size:22px;margin:0 0 8px}
  p{line-height:1.6;margin:0 0 18px;color:#4a5568}
  a.btn{display:block;background:#0b5ed7;color:#fff;text-decoration:none;font-weight:600;padding:16px;border-radius:12px;font-size:18px}
  .ar{direction:rtl;margin-top:18px;font-size:15px;color:#4a5568}
</style>
</head>
<body>
<div class="card">
  <h1>VFS Liveness</h1>
  <p id="msg">Apertura dell'app in corso…</p>
  <a id="btn" class="btn" href="#">Apri l'app VFS</a>
  <div class="ar">إذا لم يفتح التطبيق تلقائياً، اضغط الزر أعلاه.</div>
</div>
<script>
(function () {
  var hash = location.hash || '';
  var i = hash.indexOf('t=');
  var token = i >= 0 ? decodeURIComponent(hash.substring(i + 2)) : '';
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');
  if (!token || token.indexOf('VFS1.') !== 0) {
    msg.textContent = 'Link non valido o scaduto. Torna al messaggio e richiedi un nuovo link.';
    btn.style.display = 'none';
    return;
  }
  var intent = 'intent://start?t=' + encodeURIComponent(token) +
    '#Intent;scheme=vfsliveness;package=com.vfs.italyglobal;end';
  btn.setAttribute('href', intent);
  setTimeout(function () { location.href = intent; }, 400);
})();
</script>
</body>
</html>
